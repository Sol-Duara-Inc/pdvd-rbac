orgs:
- name: sol duara
  display_name: Sol Duara
  description: Created for Matheus Barcelos
  members:
  - username: mbarcelos
    role: owner
users:
- username: mbarcelos
  email: mbarcelos@solduara.com
  auth_provider: local
roles:
- name: owner
  description: Organization owner with full access and billing management
  permissions:
  - admin:org
  - write:*
  - read:*
- name: admin
  description: System administrator
  permissions:
  - admin:*
  - write:*
  - read:*
- name: editor
  description: Can create and modify resources
  permissions:
  - read:*
  - write:releases
  - write:sbom
  - write:sync
- name: viewer
  description: Read-only access
  permissions:
  - read:*
